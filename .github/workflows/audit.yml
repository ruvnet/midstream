name: Supply-chain audit

# Implements ADR-0014: cargo audit + cargo deny enforced on every PR
# and run on a daily schedule to surface freshly-published advisories.
#
# Schedule fires at 07:23 UTC to dodge the every-hour-on-the-zero
# rush; daily is the right cadence because RustSec publishes
# advisories continuously and a PR-only gate would let weekend
# advisories slip in.

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  # Required for rustsec/audit-check to post the comment on the PR.
  issues: write
  pull-requests: write
  # Required for the SARIF upload step.
  security-events: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # `stable`, not MSRV. The audit action installs the latest
      # `cargo-audit` (currently 0.22, which requires rustc 1.85+).
      # MSRV gates compile, not tooling.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1
        with:
          shared-key: audit
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    # Hard gate (promoted 2026-05-13). After PRs #13 (un-vendor
    # hyprstream), #52 (config -> figment), #54 (reqwest 0.11 -> 0.12),
    # all four `cargo deny check` subcommands pass clean on `main`.
    # If you're seeing a failure on this job, fix it — don't add
    # `continue-on-error` back; either:
    #   1. Bump the offending dep to a non-advisory version.
    #   2. Add a documented `ignore` / `skip` entry in `deny.toml`
    #      with a citing ADR + expiry date.
    # See ADR-0014 for the policy.
    strategy:
      fail-fast: false
      matrix:
        # Each `cargo deny check` subcommand can fail independently;
        # surfacing each as its own matrix entry produces clearer
        # PR feedback than a single combined run.
        check:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
        with:
          # The Embark action expands to (per its action.yml + entrypoint.sh):
          #   cargo-deny [hardcoded log/manifest] ${arguments} ${command} ${command-arguments}
          # So in our usage:
          #   arguments         → top-level options (--workspace)
          #   command           → check
          #   command-arguments → check-level options + WHICH
          # cargo-deny 0.19 makes `--workspace` a top-level option and
          # `--hide-inclusion-graph` a check-level option; the WHICH
          # value (advisories/bans/licenses/sources) is a positional arg
          # to `check`. The previous config had --workspace AFTER `check`,
          # which caused the parser to see WHICH as an unrecognized
          # top-level subcommand.
          arguments: --workspace
          command: check
          command-arguments: --hide-inclusion-graph ${{ matrix.check }}
          # log-level: surface warnings but only fail on errors.
          log-level: warn

  audit-success:
    name: Audit gates passed
    needs: [cargo-audit, cargo-deny]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check status
        # Both cargo-audit AND cargo-deny are hard gates as of
        # 2026-05-13. The cargo-deny matrix has 4 children — any one
        # of them failing turns `needs.cargo-deny.result == "failure"`.
        run: |
          if [[ "${{ needs.cargo-audit.result }}" == "failure" ]]; then
            echo "::error::cargo audit failed. See the cargo-audit job."
            exit 1
          fi
          if [[ "${{ needs.cargo-deny.result }}" == "failure" ]]; then
            echo "::error::cargo deny failed. See the cargo deny matrix jobs."
            exit 1
          fi
          echo "Supply-chain audit complete (both gates green)."
