[package]
name = "aimds-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types and abstractions for AI Manipulation Defense System (AIMDS)"

[dependencies]
# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

# Additional dependencies
derive_more = "0.99"
# validator 0.18 pulled in vulnerable idna 0.5.0 (RUSTSEC-2024-0421)
# and the unmaintained proc-macro-error. 0.20 transitively upgrades
# both. Keep this bumped to ≥0.20 — `cargo deny check advisories`
# verifies on every PR.
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
proptest.workspace = true
