[package]
name = "midstreamer-scheduler"
version = "0.2.1"
edition = "2021"
rust-version = "1.81"
description = "Ultra-low-latency real-time task scheduler"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/midstream"
keywords = ["scheduler", "real-time", "low-latency", "async", "midstream"]
categories = ["asynchronous", "concurrency"]

[lints]
workspace = true

[features]
# "native" enables tokio (mio/net), which is incompatible with wasm32.
# The library core (structs, priority queue, crossbeam channels) is
# fully usable on wasm32-unknown-unknown without this feature.
default = ["native"]
native = ["dep:tokio"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.42.0", features = ["full"], optional = true }
crossbeam = "0.8"
parking_lot = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Property-based test baseline per ADR-0038. Asserts queue
# invariants over random schedule/pop interleavings.
proptest = "1"
