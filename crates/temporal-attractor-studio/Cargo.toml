[package]
name = "midstreamer-attractor"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Dynamical systems and strange attractors analysis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/midstream"
keywords = ["attractors", "dynamical-systems", "chaos", "analysis", "midstream"]
categories = ["algorithms", "science", "visualization"]

[lints]
workspace = true

[dependencies]
midstreamer-temporal-compare = { version = "0.2.1", path = "../temporal-compare" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
nalgebra = "0.34"
ndarray = "0.16"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Property-based test baseline per ADR-0038. See
# `tests/proptest_attractor.rs`.
proptest = "1"
