[package]
name = "midstreamer-neural-solver"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Temporal logic with neural reasoning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/midstream"
keywords = ["neural", "temporal", "logic", "reasoning", "midstream"]
categories = ["algorithms", "science"]

[lints]
workspace = true

[dependencies]
midstreamer-scheduler = { version = "0.2.1", path = "../nanosecond-scheduler", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
ndarray = "0.16"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Property-based test baseline per ADR-0038. Asserts the LTL
# algebraic laws (double-negation, idempotence, globally/eventually
# duality). See `tests/proptest_ltl.rs`.
proptest = "1"
