[package]
name = "midstreamer-strange-loop"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Self-referential systems and meta-learning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/midstream"
keywords = ["meta-learning", "self-reference", "strange-loop", "cognition", "midstream"]
categories = ["algorithms", "science"]

[lints]
workspace = true

[dependencies]
midstreamer-temporal-compare = { version = "0.2.1", path = "../temporal-compare" }
midstreamer-attractor = { version = "0.2.1", path = "../temporal-attractor-studio" }
midstreamer-neural-solver = { version = "0.2.1", path = "../temporal-neural-solver" }
midstreamer-scheduler = { version = "0.2.1", path = "../nanosecond-scheduler", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
dashmap = "6.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Property-based test baseline per ADR-0038. See
# `tests/proptest_strange_loop.rs`.
proptest = "1"

[[bench]]
name = "meta_bench"
harness = false
