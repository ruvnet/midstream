<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="t d">
  <title id="t">midstreamer: dynamic time warping</title>
  <desc id="d">Two time series drawn one above the other. Alignment lines appear one by one, linking each point in the top series to its matching point in the bottom series, as dynamic time warping does.</desc>
  <style>
    .bg { fill: #0f172a; }
    .label { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
    .title { font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
    .sa { fill: none; stroke: #38bdf8; stroke-width: 3; stroke-linejoin: round; }
    .sb { fill: none; stroke: #f472b6; stroke-width: 3; stroke-linejoin: round; }
    .pa { fill: #38bdf8; }
    .pb { fill: #f472b6; }
    .link { stroke: #facc15; stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0; animation: show 6s infinite; }
    @keyframes show { 0% { opacity: 0; } 8% { opacity: 0.9; } 85% { opacity: 0.9; } 100% { opacity: 0; } }
    .l1 { animation-delay: 0.0s; } .l2 { animation-delay: 0.3s; } .l3 { animation-delay: 0.6s; }
    .l4 { animation-delay: 0.9s; } .l5 { animation-delay: 1.2s; } .l6 { animation-delay: 1.5s; }
    .l7 { animation-delay: 1.8s; } .l8 { animation-delay: 2.1s; } .l9 { animation-delay: 2.4s; }
    .l10 { animation-delay: 2.7s; }
    @media (prefers-reduced-motion: reduce) { .link { animation: none; opacity: 0.9; } }
  </style>
  <rect class="bg" width="720" height="220" rx="12"/>
  <text class="title" x="24" y="30">midstreamer · dtw(a, b)</text>
  <text class="label" x="24" y="78">a</text>
  <text class="label" x="24" y="168">b</text>

  <!-- alignment links: a[i] -> b[j] -->
  <line class="link l1"  x1="70"  y1="80" x2="70"  y2="170"/>
  <line class="link l2"  x1="130" y1="60" x2="160" y2="150"/>
  <line class="link l3"  x1="190" y1="50" x2="160" y2="150"/>
  <line class="link l4"  x1="250" y1="70" x2="250" y2="140"/>
  <line class="link l5"  x1="310" y1="95" x2="340" y2="160"/>
  <line class="link l6"  x1="370" y1="100" x2="400" y2="185"/>
  <line class="link l7"  x1="430" y1="85" x2="460" y2="175"/>
  <line class="link l8"  x1="490" y1="60" x2="520" y2="150"/>
  <line class="link l9"  x1="550" y1="55" x2="580" y2="140"/>
  <line class="link l10" x1="640" y1="75" x2="660" y2="160"/>

  <polyline class="sa" points="70,80 130,60 190,50 250,70 310,95 370,100 430,85 490,60 550,55 640,75"/>
  <polyline class="sb" points="70,170 160,150 250,140 340,160 400,185 460,175 520,150 580,140 660,160"/>

  <g class="pa">
    <circle cx="70" cy="80" r="4"/><circle cx="130" cy="60" r="4"/><circle cx="190" cy="50" r="4"/>
    <circle cx="250" cy="70" r="4"/><circle cx="310" cy="95" r="4"/><circle cx="370" cy="100" r="4"/>
    <circle cx="430" cy="85" r="4"/><circle cx="490" cy="60" r="4"/><circle cx="550" cy="55" r="4"/>
    <circle cx="640" cy="75" r="4"/>
  </g>
  <g class="pb">
    <circle cx="70" cy="170" r="4"/><circle cx="160" cy="150" r="4"/><circle cx="250" cy="140" r="4"/>
    <circle cx="340" cy="160" r="4"/><circle cx="400" cy="185" r="4"/><circle cx="460" cy="175" r="4"/>
    <circle cx="520" cy="150" r="4"/><circle cx="580" cy="140" r="4"/><circle cx="660" cy="160" r="4"/>
  </g>
  <text class="label" x="24" y="206">WebAssembly · Node.js and browsers</text>
</svg>
